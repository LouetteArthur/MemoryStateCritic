seed: 42

# State-only critic V(s)
# Actor:  Conv2d encoder -> Linear(128) -> GRU(256) -> actions
# Critic: MLP on the privileged state only (asymmetric actor-critic)
#
# The critic does NOT receive the actor's hidden state; contrast with
# skrl_ppo_memory_state_critic_cfg.yaml, which adds the detached z^a.

models:
  separate: True
  policy:
    class: GaussianCNNRNNMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    rnn:
      type: gru
      hidden_size: 256
      num_layers: 1
      sequence_length: 16  # BPTT across 16-step sequences
  value:  # Asymmetric critic: privileged state vector
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
memory:
  class: RandomMemory
  memory_size: -1


# PPO_RNN agent configuration
agent:
  class: PPO_RNN_ASYM

  rollouts: 32
  learning_epochs: 8
  mini_batches: 4

  discount_factor: 0.99
  lambda: 0.95

  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    min_lr: 1.0e-05

  state_preprocessor: null  # Actor images — no standard scaling
  state_preprocessor_kwargs: null
  critic_state_preprocessor: RunningStandardScaler
  critic_state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True

  entropy_loss_scale: 0.01
  value_loss_scale: 2.0

  kl_threshold: 0.0

  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False

  experiment:
    directory: "training"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

    wandb: true
    wandb_kwargs:
      project: "ppo_state_critic"
      entity: ""
      name: ""


# Sequential trainer
trainer:
  class: SequentialTrainer
  timesteps: 20000
  environment_info: log

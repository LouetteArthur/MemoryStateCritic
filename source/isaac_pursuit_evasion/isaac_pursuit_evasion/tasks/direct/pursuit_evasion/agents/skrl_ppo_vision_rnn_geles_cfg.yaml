seed: 42

# CNN+GRU vision PPO with Geles-style unbiased critic V(s, o, a)
# Actor: Conv2d encoder → Linear(128) → GRU(256) → actions (same as other RNN variants)
# Critic: CNN(image) + MLP(past_actions) + MLP(state) → concat → MLP → value
#
# The critic receives the privileged state, the actor's image observations,
# AND past actions — following the "unbiased asymmetric actor-critic" of
# Geles et al. "Demonstrating Agile Flight from Pixels" (RSS 2024).
# State component is normalized via RunningStandardScaler in PPO_RNN_VSH.

models:
  separate: True
  policy:
    class: GaussianCNNRNNMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    rnn:
      type: gru
      hidden_size: 256
      num_layers: 1
      sequence_length: 16  # BPTT across 16-step sequences
  value:  # Unbiased critic: V(s, o, a) — state + image + past_actions
    class: DeterministicMixin
    clip_actions: False
    network:
      # CNN encoder for image (same architecture as actor CNN)
      - name: cnn
        input: STATES["image"]
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: cnn_linear
        input: cnn
        layers: [128]
        activations: elu
      # MLP for past actions
      - name: past_actions_net
        input: STATES["past_actions"]
        layers: [32]
        activations: elu
      # MLP for privileged state vector (normalized by state_component_scaler)
      - name: state_net
        input: STATES["state"]
        layers: [128, 64]
        activations: elu
      # Combined head: image features + past_actions features + state features
      - name: net
        input: concatenate([cnn_linear, past_actions_net, state_net])
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
memory:
  class: RandomMemory
  memory_size: -1


# PPO_RNN_ASYM agent — handles BPTT for GRU actor + asymmetric Dict critic
agent:
  class: PPO_RNN_ASYM

  rollouts: 32
  learning_epochs: 8
  mini_batches: 4

  discount_factor: 0.99
  lambda: 0.95

  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    min_lr: 1.0e-05

  state_preprocessor: null  # Actor images — no standard scaling
  state_preprocessor_kwargs: null
  critic_state_preprocessor: null  # Dict critic — state component normalized internally
  critic_state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True

  entropy_loss_scale: 0.01
  value_loss_scale: 2.0

  kl_threshold: 0.0

  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False

  experiment:
    directory: "training"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

    wandb: true
    wandb_kwargs:
      project: "ppo_vision_rnn_geles"
      entity: ""
      name: ""


# Sequential trainer
trainer:
  class: SequentialTrainer
  timesteps: 20000
  environment_info: log

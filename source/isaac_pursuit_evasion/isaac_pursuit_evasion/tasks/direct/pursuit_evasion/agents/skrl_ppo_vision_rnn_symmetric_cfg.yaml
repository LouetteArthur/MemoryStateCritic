seed: 42

# Symmetric CNN+GRU vision PPO — actor and critic use same observation
# Actor: Conv2d encoder → Linear(128) → GRU(256) → actions (temporal memory)
# Critic: Conv2d encoder → Linear(128) + past_actions → MLP → value (no privileged state)
#
# This is the symmetric RNN baseline: the critic sees only what the actor sees
# (image + past_actions), with NO privileged state vector.
# Contrast with skrl_ppo_vision_rnn_cfg.yaml (asym V(s)) where the critic
# receives the full privileged state.

models:
  separate: True
  policy:
    class: GaussianCNNRNNMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    rnn:
      type: gru
      hidden_size: 256
      num_layers: 1
      sequence_length: 16  # BPTT across 16-step sequences
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: cnn
        input: STATES["image"]
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: cnn_linear
        input: cnn
        layers: [128]
        activations: elu
      - name: past_actions_net
        input: STATES["past_actions"]
        layers: [32]
        activations: elu
      - name: net
        input: concatenate([cnn_linear, past_actions_net])
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
memory:
  class: RandomMemory
  memory_size: -1


# PPO_RNN agent — handles BPTT for the GRU actor, non-RNN critic is fine
agent:
  class: PPO_RNN

  rollouts: 32
  learning_epochs: 8
  mini_batches: 4

  discount_factor: 0.99
  lambda: 0.95

  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    min_lr: 1.0e-05

  state_preprocessor: null  # Actor images — no standard scaling
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True

  entropy_loss_scale: 0.01
  value_loss_scale: 2.0

  kl_threshold: 0.0

  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False

  experiment:
    directory: "training"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

    wandb: true
    wandb_kwargs:
      project: "ppo_vision_rnn_symmetric"
      entity: ""
      name: ""


# Sequential trainer
trainer:
  class: SequentialTrainer
  timesteps: 20000
  environment_info: log

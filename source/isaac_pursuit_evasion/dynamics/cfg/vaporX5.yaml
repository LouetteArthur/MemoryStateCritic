# vapor_x5.yaml
name: VaporX5
mass: 0.608 # (kg)

# architecture
front_arm_length: 0.115 # meters, for a 5" quad (half-arm length)
back_arm_length: 0.115
front_arm_angle: 0.785398163 # pi/4 rad
back_arm_angle: 0.785398163 # pi/4 rad

# Motor
tau_m: 0.01  # motor time constants (s) for each rotor
# Thrust coefficient.
# Calculated with 4557 rad/s max angular velociy, thrust to weight: 3.5, mass: 0.6076 kg and gravity: 9.81 m/s^2.
# thrust_coef = (3.5 * 0.6076 * 9.81) / (4 * 4557**2) = 2.5115e-7."""
# Motor/prop coefficients (absolute, in SI base units)
# k_eta: thrust coefficient  T = k_eta * omega^2   [N / (rad/s)^2]
#   From YAML comment: (3.5 * 0.6076 * 9.81) / (4 * 4557^2) = 2.5115e-7
k_eta: 2.5115e-7
# k_m: yaw torque coefficient  tau = k_m * omega^2   [N·m / (rad/s)^2]
#   The original prop_drag_coeff=1.5e-2 is the dimensionless ratio k_d = k_m/k_eta.
#   Typical k_d/k_t for 5" props is 0.01–0.02 (literature: ~0.015 for 5x4.5 props).
#   k_m = k_d * k_eta = 1.5e-2 * 2.5115e-7 = 3.767e-9
k_m: 3.767e-9

# Aerodynamic drag (body frame, rotor-wash model: F_drag = sum(omega) * k_aero * v)
#   The original drag_coeff=0.224 is a lumped linear drag D [N/(m/s)].
#   At hover: omega_hover = sqrt(m*g/(4*k_eta)) = 2437 rad/s, sum(omega) = 9748 rad/s.
#   k_aero_xy = D / sum(omega) = 0.224 / 9748 ≈ 2.30e-5
#   k_aero_z slightly higher (same ratio as Crazyflie: ~1.12x).
k_aero_xy: 2.30e-5
k_aero_z: 2.58e-5
inertia: [0.003, 0.003, 0.006]  # inertia tensor (Ixx, Iyy, Izz) in kg·m²

rotor_inertia: 0 #1.0e-5 # Jr+p, rotor + prop inertia for motor torque (kg·m²)
omega_max: 4557.0
#     Maximum angular velocity of the drone motors in rad/s.
#     Calculated with 1960KV motor, with 6S LiPo battery with 4.2V per cell.
#     1960 * 6 * 3.7 = 43,512 RPM ~= 4557 rad/s."""

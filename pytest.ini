[pytest]
testpaths = tests
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    stochastic: end-to-end learning tests whose assertion is a threshold on how
        much PPO improves within a small budget. They are meaningful but not
        deterministic: the outcome depends on the BLAS backend, the thread count
        and the Python/torch build, so they are excluded from CI
        (-m "not stochastic") and run locally instead.

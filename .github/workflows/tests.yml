# The test suite runs without Isaac Sim: tests/conftest.py installs an import hook on
# sys.meta_path that stubs isaaclab, isaacsim, carb, omni, wandb and tensordict. That
# makes the whole suite runnable on a stock CPU runner, which is what lets this
# workflow exist at all.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-minimal.txt pins the CUDA build used on the training
          # hosts; the runner has no GPU, so take the CPU wheels instead.
          pip install torch==2.7.0 torchvision==0.22.0 \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision|--extra-index-url)' requirements-minimal.txt \
            > /tmp/reqs-ci.txt
          pip install -r /tmp/reqs-ci.txt
          # The suite imports both packages (see requirements-minimal.txt header).
          pip install -e source/third_parties/skrl/
          pip install -e source/isaac_pursuit_evasion/ --no-deps

      - name: Run tests
        run: pytest tests/ -q
